services:
  # Backend Web Service
  - type: web
    name: voting-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: False
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: voting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://online-voting-system-mini.netlify.app,*"
    healthCheckPath: /api/candidates

databases:
  # PostgreSQL Database
  - name: voting-db
    databaseName: voting_system
    user: voting_user
